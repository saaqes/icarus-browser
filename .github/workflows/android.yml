name: Android

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Núcleo, APK y lint
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: mobile/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Comprobar que mobile/shared está al día con escritorio
        working-directory: .
        run: |
          npm ci
          npx vitest run electron/shared
          npm run build:electron
          set -o pipefail
          node scripts/release/version.mjs check | tee version.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a  # v4.4.3
      - name: Pruebas del núcleo (vectores compartidos con escritorio)
        run: ./gradlew -p core test --console=plain
      - name: Compilar el APK y revisar con lint
        env:
          # La versión y el versionCode salen de package.json (ver app/build.gradle.kts).
          # La firma propia solo se usa si el repositorio define estos secretos.
          ICARUS_KEYSTORE_BASE64: ${{ secrets.ICARUS_KEYSTORE_BASE64 }}
          ICARUS_KEYSTORE_PASSWORD: ${{ secrets.ICARUS_KEYSTORE_PASSWORD }}
          ICARUS_KEY_ALIAS: ${{ secrets.ICARUS_KEY_ALIAS }}
          ICARUS_KEY_PASSWORD: ${{ secrets.ICARUS_KEY_PASSWORD }}
        run: |
          if [ -n "$ICARUS_KEYSTORE_BASE64" ]; then
            echo "$ICARUS_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/icarus.keystore"
            export ICARUS_KEYSTORE_PATH="$RUNNER_TEMP/icarus.keystore"
            echo "Firma: almacén de claves de los secretos del repositorio."
          else
            echo "Firma: clave de depuración (sin secretos de firma). Sirve para instalar a mano, no para publicar en una tienda."
          fi
          ./gradlew :app:assembleRelease :app:lintDebug --console=plain
          rm -f "$RUNNER_TEMP/icarus.keystore"
      - name: Preparar el APK
        run: |
          version=$(node -p "require('../../version.json').version")
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/ICARUS-Browser-${version}-android.apk"
          cd dist && sha256sum *.apk > SHA256SUMS-android.txt && cat SHA256SUMS-android.txt
          ls -l
      - name: Comprobar el contenido del APK
        run: |
          apk=$(ls dist/*.apk)
          unzip -l "$apk" | grep -E "assets/(defaults.json|shield-basic.txt|public-suffix-rules.txt|themes.json|strings.json)" | tee /tmp/assets.txt
          test "$(wc -l < /tmp/assets.txt)" -eq 5
          if unzip -l "$apk" | grep -q "test-vectors"; then echo "Los vectores de prueba no deben empaquetarse"; exit 1; fi
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$tools/apksigner" verify --print-certs "$apk" | head -5
          # La versión del APK es la de package.json, con el versionCode del manifiesto de actualización.
          badging=$("$tools/aapt" dump badging "$apk" | head -1)
          echo "$badging"
          echo "$badging" | grep -q "versionCode='$(node -p "require('../../version.json').versionCode")'"
          echo "$badging" | grep -q "versionName='$(node -p "require('../../version.json').version")'"
          echo "$badging" | grep -q "name='io.github.saaqes.icarusbrowser'"
      - uses: actions/upload-artifact@v4
        with:
          name: icarus-browser-android
          path: mobile/android/dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-lint
          path: mobile/android/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

  emulator:
    name: Prueba en emulador (Android 14)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a  # v4.4.3
      - name: Activar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Compilar la app y las pruebas
        working-directory: mobile/android
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --console=plain
      - name: Ejecutar la prueba de humo en el emulador
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d  # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: mobile/android
          script: |
            adb logcat -c
            ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.internet=1 --console=plain || touch ../../emulator-failed
            adb logcat -d -v raw -s IcarusScreenshot:I > ../../screenshots.log || true
            adb logcat -d > ../../logcat.txt || true
      - name: Extraer las capturas
        if: always()
        run: |
          mkdir -p screenshots
          python3 - <<'EOF'
          import base64, pathlib
          lines = pathlib.Path("screenshots.log").read_text(errors="ignore").splitlines() if pathlib.Path("screenshots.log").exists() else []
          name, chunks = None, []
          for line in lines:
              line = line.strip()
              if line.startswith("BEGIN "):
                  name, chunks = line.split()[1], []
              elif line.startswith("END ") and name:
                  pathlib.Path(f"screenshots/{name}.jpg").write_bytes(base64.b64decode("".join(chunks)))
                  print("captura:", name)
                  name = None
              elif name:
                  chunks.append(line)
          EOF
          ls -l screenshots
      - name: Capturas en el registro (base64)
        if: always()
        run: cat screenshots.log 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-emulator
          path: |
            screenshots/
            logcat.txt
            mobile/android/app/build/reports/androidTests/
          if-no-files-found: ignore
      - name: Resultado
        run: |
          if [ -f emulator-failed ]; then
            echo "La prueba en el emulador falló."
            grep -E "IcarusScreenshot|AndroidRuntime|TestRunner|AssertionError|Tiempo agotado" logcat.txt | tail -80 || true
            exit 1
          fi
