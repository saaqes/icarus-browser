name: Publicación

# Compila, prueba y publica ICARUS Browser para todas las plataformas (Windows,
# macOS, Android, iPhone/iPad) junto con el manifiesto firmado que usan las
# actualizaciones integradas.
#
# Cuándo se publica (subir commits a una rama nunca publica nada):
# - Etiqueta vX.Y.Z           → versión ESTABLE: la reciben todas las instalaciones.
# - Etiqueta vX.Y.Z-preview.N → versión PRELIMINAR: solo el canal «Vista previa».
# - Lanzamiento manual        → BORRADOR privado para revisar los paquetes; nunca
#                               llega a los usuarios (no lleva manifiesto).
#
# Antes de publicar se comprueba que la etiqueta coincide con package.json, que la
# versión no está publicada ni es anterior a otra publicada, que existen la clave
# pública y los secretos de firma, que pasan todas las pruebas, que están todos
# los paquetes y sus sumas, y que el manifiesto firmado es válido. La versión se
# crea primero como borrador, se publica cuando todos los archivos están subidos
# y, al final, se descargan sin credenciales para comprobar que son los firmados.
# El trabajo de publicación usa el entorno «release»: en Settings → Environments
# se le pueden añadir revisores obligatorios para aprobar cada publicación.
# Ver docs/UPDATES.md.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Comprobar la versión y los requisitos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:electron
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_SIGNING_KEY: ${{ secrets.ICARUS_UPDATE_SIGNING_KEY != '' }}
          HAS_KEYSTORE: ${{ secrets.ICARUS_KEYSTORE_BASE64 != '' && secrets.ICARUS_KEYSTORE_PASSWORD != '' && secrets.ICARUS_KEY_ALIAS != '' && secrets.ICARUS_KEY_PASSWORD != '' }}
        run: node scripts/release/plan.mjs

  ci:
    needs: plan
    uses: ./.github/workflows/ci.yml
  windows:
    needs: plan
    uses: ./.github/workflows/windows.yml
  macos:
    needs: plan
    uses: ./.github/workflows/macos.yml
  android:
    needs: plan
    uses: ./.github/workflows/android.yml
    secrets: inherit
  ios:
    needs: plan
    uses: ./.github/workflows/ios.yml

  publish:
    name: Publicar (o crear el borrador)
    needs: [plan, ci, windows, macos, android, ios]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release
    permissions:
      contents: write
    env:
      MODE: ${{ needs.plan.outputs.mode }}
      VERSION: ${{ needs.plan.outputs.version }}
      TAG: ${{ needs.plan.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:electron
      - uses: actions/download-artifact@v4
        with:
          pattern: icarus-browser-*
          path: release
          merge-multiple: true

      - name: Comprobar los paquetes y sus sumas
        run: |
          cd release
          ls -l
          for sums in SHA256SUMS*.txt; do sha256sum -c "$sums"; done
          ls "ICARUS-Browser-$VERSION-ios-simulador.zip" >/dev/null

      - name: Notas de la versión
        run: |
          # Novedades: mensaje de la etiqueta anotada, o docs/release-notes/VERSIÓN.md.
          : > changes.md
          if [ "$MODE" != draft ] && [ "$(git cat-file -t "refs/tags/$TAG" 2>/dev/null)" = tag ]; then
            git tag -l --format='%(contents:subject)%0a%0a%(contents:body)' "$TAG" | sed -e '/^-----BEGIN PGP SIGNATURE-----/,$d' > changes.md
          fi
          if ! grep -q '[^[:space:]]' changes.md && [ -f "docs/release-notes/$VERSION.md" ]; then cp "docs/release-notes/$VERSION.md" changes.md; fi
          if ! grep -q '[^[:space:]]' changes.md; then echo "ICARUS Browser $VERSION." > changes.md; fi
          {
            cat changes.md
            echo
            echo "Generada y probada por GitHub Actions (ejecución $GITHUB_RUN_ID, commit $GITHUB_SHA)."
            echo
            echo "| Plataforma | Archivo | Actualizaciones |"
            echo "| --- | --- | --- |"
            echo "| Windows 10/11 x64 | \`ICARUS-Browser-Setup-$VERSION.exe\` (instalador) o \`ICARUS-Browser-$VERSION-win-x64.zip\` (portátil) | Instalador: se actualiza desde el navegador. Portátil: descarga y verifica, y la colocas tú. Sin firma de código: SmartScreen avisa al instalar. |"
            echo "| macOS (Apple Silicon / Intel) | \`ICARUS-Browser-$VERSION-mac-arm64.dmg\` / \`ICARUS-Browser-$VERSION-mac-x64.dmg\` | Se actualiza desde el navegador si está en una carpeta con permiso de escritura (p. ej. Aplicaciones). Firma ad hoc, sin notarizar. |"
            echo "| Android 10 o posterior | \`ICARUS-Browser-$VERSION-android.apk\` | El navegador descarga y verifica el APK; Android pide confirmación para instalarlo. |"
            echo "| iPhone/iPad (iOS 16+) | \`ICARUS-Browser-$VERSION-ios-sin-firmar.ipa\` | Sin firmar (hay que firmarlo con tu Apple ID). La app avisa de versiones nuevas; iOS no permite instalarlas desde la propia app. |"
            echo "| Simulador de iOS | \`ICARUS-Browser-$VERSION-ios-simulador.zip\` | Para probar en Xcode. |"
            echo
            echo "Las sumas SHA-256 están en \`SHA256SUMS*.txt\`; \`icarus-update.json\` y su firma \`icarus-update.json.sig\` son el manifiesto que verifican las actualizaciones. Instrucciones en el README."
          } > body.md
          cat body.md

      - name: Generar el manifiesto de actualización
        run: node scripts/release/make-manifest.mjs --dir release --version "$VERSION" --commit "$GITHUB_SHA" --notes-file changes.md

      - name: Firmar y verificar el manifiesto
        env:
          ICARUS_UPDATE_SIGNING_KEY: ${{ secrets.ICARUS_UPDATE_SIGNING_KEY }}
        run: |
          if [ -z "$ICARUS_UPDATE_SIGNING_KEY" ] || [ ! -f build/update-public-key.pem ]; then
            if [ "$MODE" != draft ]; then echo "::error::Falta la clave de firma o build/update-public-key.pem (ver docs/UPDATES.md)."; exit 1; fi
            echo "::warning::Sin clave de firma: el manifiesto del borrador queda sin firmar."
            exit 0
          fi
          node scripts/release/sign-manifest.mjs --dir release
          node scripts/release/verify-release.mjs --dir release --version "$VERSION" --commit "$GITHUB_SHA"

      - name: Guardar el manifiesto como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: icarus-update-manifest
          path: release/icarus-update.json*
          if-no-files-found: error

      - name: Crear la versión (como borrador)
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then echo "::error::Ya existe una versión o un borrador con la etiqueta $TAG: no se publica dos veces."; exit 1; fi
          files=(release/ICARUS-Browser-* release/SHA256SUMS*.txt)
          args=(--draft --notes-file body.md)
          if [ "$MODE" = draft ]; then
            # El borrador no lleva manifiesto: aunque se publicara a mano, la app no lo ofrecería.
            args+=(--prerelease --target "$GITHUB_SHA" --title "ICARUS Browser $TAG (borrador, Windows, macOS, Android, iPhone)")
          else
            args+=(--title "ICARUS Browser $VERSION")
            files+=(release/icarus-update.json release/icarus-update.json.sig)
            args+=(--verify-tag)
            if [ "$MODE" = preview ]; then args+=(--prerelease); fi
          fi
          if ! gh release create "$TAG" "${files[@]}" "${args[@]}"; then
            # El token del flujo no puede crear una versión en un commit cuyos archivos de
            # .github/workflows difieren de los de la rama (por ejemplo, si se subió otro commit
            # que los cambia mientras esta ejecución compilaba).
            echo "::error::GitHub no dejó crear la versión. Si durante esta ejecución se subió un commit que cambia .github/workflows, vuelve a lanzar el flujo sobre el último commit."
            exit 1
          fi
          # Todos los archivos subidos y con su tamaño, antes de que nadie pueda verlos.
          gh release view "$TAG" --json assets --jq '.assets[] | "\(.name) \(.size)"' | sort > uploaded.txt
          for file in "${files[@]}"; do printf '%s %s\n' "$(basename "$file")" "$(stat -c %s "$file")"; done | sort > expected.txt
          diff expected.txt uploaded.txt || { echo "::error::Los archivos subidos no coinciden con los paquetes."; exit 1; }
          echo "Borrador $TAG con ${#files[@]} archivos."

      - name: Publicar
        if: needs.plan.outputs.mode != 'draft'
        run: |
          if [ "$MODE" = stable ]; then
            gh release edit "$TAG" --draft=false --latest
          else
            gh release edit "$TAG" --draft=false --prerelease --latest=false
          fi
          echo "Publicada $TAG ($MODE)."

      - name: Comprobar la versión publicada (sin credenciales)
        if: needs.plan.outputs.mode != 'draft'
        run: |
          latest=()
          if [ "$MODE" = stable ]; then latest=(--latest); fi
          if ! node scripts/release/verify-release.mjs --dir release --remote "https://github.com/$GH_REPO" "${latest[@]}"; then
            # Si lo publicado no es lo firmado, se vuelve a ocultar para que no se instale.
            gh release edit "$TAG" --draft=true
            echo "::error::La versión publicada no superó la comprobación y se ha vuelto a convertir en borrador."
            exit 1
          fi
