# Empaquetado de ICARUS Browser con electron-builder.
# Windows: instalador NSIS (.exe) y paquete portátil (.zip), ambos x64.
appId: io.github.saaqes.icarusbrowser
productName: ICARUS Browser
copyright: Copyright © 2026 ICARUS Browser
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - "!dist/icarus-browser.html"
  - dist-electron/**
  - package.json
asar: true
# Idiomas de Chromium incluidos (mensajes de formularios, diálogos…).
electronLanguages: [es, es-419, en-US, en-GB, pt-BR, fr, de, it]
win:
  target:
    - target: nsis
      arch: [x64]
    - target: zip
      arch: [x64]
  icon: build/icon.ico
  artifactName: ICARUS-Browser-${version}-win-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: ICARUS Browser
  uninstallDisplayName: ICARUS Browser
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  # Los datos del usuario (%APPDATA%\ICARUS Browser) se conservan al actualizar y al desinstalar.
  deleteAppDataOnUninstall: false
  artifactName: ICARUS-Browser-Setup-${version}.${ext}
linux:
  target: [dir]
  icon: build/icon.png
  category: Network
mac:
  target: [dir]
  icon: build/icon.png
# Endurecimiento del ejecutable de Electron.
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false
publish: null
