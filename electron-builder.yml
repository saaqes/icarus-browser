# Empaquetado de ICARUS Browser con electron-builder.
# Windows: instalador NSIS (.exe) y paquete portátil (.zip), ambos x64.
# macOS: imagen de disco (.dmg) y .zip para Apple Silicon (arm64) e Intel (x64).
appId: io.github.saaqes.icarusbrowser
productName: ICARUS Browser
copyright: Copyright © 2026 ICARUS Browser
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - "!dist/icarus-browser.html"
  - dist-electron/**
  - package.json
asar: true
# Idiomas de Chromium incluidos (mensajes de formularios, diálogos…).
electronLanguages: [es, es-419, en-US, en-GB, pt-BR, fr, de, it]
win:
  target:
    - target: nsis
      arch: [x64]
    - target: zip
      arch: [x64]
  icon: build/icon.ico
  artifactName: ICARUS-Browser-${version}-win-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: ICARUS Browser
  uninstallDisplayName: ICARUS Browser
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  # Los datos del usuario (%APPDATA%\ICARUS Browser) se conservan al actualizar y al desinstalar.
  deleteAppDataOnUninstall: false
  artifactName: ICARUS-Browser-Setup-${version}.${ext}
linux:
  target: [dir]
  icon: build/icon.png
  category: Network
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  icon: build/icon.png
  category: public.app-category.productivity
  # Firma ad hoc («-»): Apple Silicon no ejecuta binarios sin firmar. No hay firma de
  # Developer ID ni notarización (requieren una cuenta de desarrollador de Apple), así
  # que macOS avisa la primera vez que se abre (ver README → macOS).
  identity: "-"
  hardenedRuntime: false
  gatekeeperAssess: false
  artifactName: ICARUS-Browser-${version}-mac-${arch}.${ext}
  extendInfo:
    NSCameraUsageDescription: Algunos sitios web piden la cámara (por ejemplo, para videollamadas). ICARUS te pregunta antes de permitirlo.
    NSMicrophoneUsageDescription: Algunos sitios web piden el micrófono (por ejemplo, para videollamadas). ICARUS te pregunta antes de permitirlo.
    NSLocationUsageDescription: Algunos sitios web piden tu ubicación (por ejemplo, mapas). ICARUS te pregunta antes de compartirla.
    NSLocationWhenInUseUsageDescription: Algunos sitios web piden tu ubicación (por ejemplo, mapas). ICARUS te pregunta antes de compartirla.
dmg:
  title: ICARUS Browser ${version}
  artifactName: ICARUS-Browser-${version}-mac-${arch}.${ext}
# Endurecimiento del ejecutable de Electron.
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false
publish: null
